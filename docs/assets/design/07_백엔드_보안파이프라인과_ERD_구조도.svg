<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="540" viewBox="0 0 1100 540" role="img" aria-label="백엔드 사진 보안 파이프라인 및 SQLite 6개 테이블 ERD 구조도">
  <title>백엔드 사진 보안 파이프라인 및 SQLite 6개 테이블 ERD 구조도</title>
  <defs>
    <marker id="erdArr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,1 L8,4.5 L0,8 Z" fill="#0F5132"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Malgun Gothic", "맑은 고딕", sans-serif; }
    .mono { font-family: Consolas, "Courier New", monospace; }
  </style>

  <rect x="0" y="0" width="1100" height="540" rx="18" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>

  <!-- TOP HALF: SECURITY & MEDIA PIPELINE -->
  <text x="28" y="34" font-size="15.5" font-weight="800" fill="#0F3D2E">A. 백엔드 요청 방어 및 자택 가구 사진 보안 처리 파이프라인</text>

  <rect x="28" y="46" width="194" height="104" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
  <rect x="28" y="46" width="194" height="28" rx="10" fill="#1E293B"/>
  <text x="125" y="65" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">1. 클라이언트 전처리</text>
  <text x="40" y="92" font-size="11" fill="#334155">• iOS HEIC → JPEG 유도</text>
  <text x="40" y="111" font-size="11" fill="#334155">• EXIF 방향 회전 자동 보정</text>
  <text x="40" y="130" font-size="11" fill="#334155">• 최대 1440px 리사이즈 압축</text>

  <line x1="224" y1="98" x2="244" y2="98" stroke="#0F5132" stroke-width="2" marker-end="url(#erdArr)"/>

  <rect x="248" y="46" width="194" height="104" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
  <rect x="248" y="46" width="194" height="28" rx="10" fill="#1E3A8A"/>
  <text x="345" y="65" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">2. 요청 보안 게이트</text>
  <text x="260" y="92" font-size="11" fill="#334155">• Origin 헤더 CSRF 검증</text>
  <text x="260" y="111" font-size="11" fill="#334155">• IP 도배·5회 로그인 잠금</text>
  <text x="260" y="130" font-size="11" fill="#334155">• Idempotency 중복접수 차단</text>

  <line x1="444" y1="98" x2="464" y2="98" stroke="#0F5132" stroke-width="2" marker-end="url(#erdArr)"/>

  <rect x="468" y="46" width="194" height="104" rx="10" fill="#FFFFFF" stroke="#0F5132" stroke-width="1.5"/>
  <rect x="468" y="46" width="194" height="28" rx="10" fill="#0F5132"/>
  <text x="565" y="65" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">3. 미디어 무결성·비식별화</text>
  <text x="480" y="92" font-size="11" fill="#334155">• 매직바이트 시그니처 검증</text>
  <text x="480" y="111" font-size="11" font-weight="700" fill="#0F5132">• JPEG EXIF/GPS 위치 제거</text>
  <text x="480" y="130" font-size="11" fill="#334155">• UUID 난수 파일명 격리 저장</text>

  <line x1="664" y1="98" x2="684" y2="98" stroke="#0F5132" stroke-width="2" marker-end="url(#erdArr)"/>

  <rect x="688" y="46" width="184" height="104" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
  <rect x="688" y="46" width="184" height="28" rx="10" fill="#0F3D2E"/>
  <text x="780" y="65" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">4. 원자적 트랜잭션</text>
  <text x="700" y="92" font-size="11" fill="#334155">• 신청+품목+사진 일괄 커밋</text>
  <text x="700" y="111" font-size="11" fill="#334155">• 오류 시 고아파일 즉시 삭제</text>
  <text x="700" y="130" font-size="11" fill="#334155">• version 낙관적 잠금(409)</text>

  <line x1="874" y1="98" x2="894" y2="98" stroke="#0F5132" stroke-width="2" marker-end="url(#erdArr)"/>

  <rect x="898" y="46" width="174" height="104" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
  <rect x="898" y="46" width="174" height="28" rx="10" fill="#334155"/>
  <text x="985" y="65" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">5. 권한 검증 서빙·출력</text>
  <text x="910" y="92" font-size="11" fill="#334155">• 본인·관리자만 사진 열람</text>
  <text x="910" y="111" font-size="11" fill="#334155">• nosniff 보안 헤더 적용</text>
  <text x="910" y="130" font-size="11" fill="#334155">• CSV 수식 인젝션 방어</text>

  <!-- BOTTOM HALF: 6-TABLE NORMALIZED ERD -->
  <text x="28" y="186" font-size="15.5" font-weight="800" fill="#0F3D2E">B. 정규화 데이터베이스 스키마 관계도 (Node 내장 node:sqlite · 총 6개 테이블)</text>

  <!-- Table 1: USERS -->
  <rect x="28" y="202" width="220" height="156" rx="10" fill="#FFFFFF" stroke="#475569" stroke-width="1.5"/>
  <rect x="28" y="202" width="220" height="30" rx="10" fill="#334155"/>
  <text x="42" y="222" font-size="12.5" font-weight="800" fill="#FFFFFF">USERS (회원·관리자)</text>
  <text x="40" y="248" font-size="11" class="mono" fill="#0F172A">PK id (INTEGER)</text>
  <text x="40" y="266" font-size="11" class="mono" fill="#1E40AF">UK login_id (휴대폰/관리자ID)</text>
  <text x="40" y="284" font-size="11" fill="#334155">• role (CUSTOMER | ADMIN)</text>
  <text x="40" y="302" font-size="11" fill="#334155">• password_hash (scrypt)</text>
  <text x="40" y="320" font-size="11" fill="#334155">• name, phone</text>
  <text x="40" y="338" font-size="11" fill="#64748B">• default_zipcode / address</text>

  <!-- Table 6: IDEMPOTENCY_KEYS -->
  <rect x="28" y="376" width="220" height="142" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  <rect x="28" y="376" width="220" height="30" rx="10" fill="#64748B"/>
  <text x="42" y="396" font-size="12" font-weight="800" fill="#FFFFFF">IDEMPOTENCY_KEYS</text>
  <text x="40" y="422" font-size="11" class="mono" fill="#0F172A">PK key (TEXT)</text>
  <text x="40" y="442" font-size="11" fill="#334155">• endpoint (요청 경로)</text>
  <text x="40" y="460" font-size="11" fill="#334155">• status_code (응답 코드)</text>
  <text x="40" y="478" font-size="11" fill="#334155">• response_json (캐시 응답)</text>
  <text x="40" y="498" font-size="10.5" fill="#64748B">모바일 중복 클릭 접수 원천 방지</text>

  <!-- Relation USERS -> APPLICATIONS -->
  <line x1="248" y1="275" x2="294" y2="275" stroke="#0F5132" stroke-width="2" marker-end="url(#erdArr)"/>
  <text x="271" y="267" font-size="10.5" font-weight="700" fill="#0F5132" text-anchor="middle">1 : N</text>

  <!-- Table 2: APPLICATIONS -->
  <rect x="298" y="202" width="246" height="316" rx="10" fill="#FFFFFF" stroke="#0F5132" stroke-width="1.8"/>
  <rect x="298" y="202" width="246" height="32" rx="10" fill="#0F3D2E"/>
  <text x="312" y="223" font-size="12.5" font-weight="800" fill="#FFFFFF">APPLICATIONS (신청 마스터)</text>
  <text x="312" y="250" font-size="11" class="mono" fill="#0F172A">PK id / UK request_code</text>
  <text x="312" y="269" font-size="11" class="mono" fill="#0F5132">FK user_id (비회원 시 NULL)</text>
  <text x="312" y="288" font-size="11" fill="#334155">• lookup_pin_hash (4자리 PIN)</text>
  <text x="312" y="307" font-size="11" fill="#334155">• applicant_name, phone</text>
  <text x="312" y="326" font-size="11" fill="#334155">• zipcode, address, detail</text>
  <text x="312" y="345" font-size="11" fill="#334155">• elevator_info (승강기 여건)</text>
  <text x="312" y="364" font-size="11" font-weight="700" fill="#BE123C">• moving_date (이사일)</text>
  <text x="312" y="383" font-size="11" font-weight="700" fill="#0F5132">• preferred_pickup_date</text>
  <text x="312" y="402" font-size="11" fill="#334155">• customer_memo / admin_memo</text>
  <text x="312" y="421" font-size="11" fill="#334155">• privacy / marketing 동의</text>
  <text x="312" y="440" font-size="11" fill="#64748B">• is_demo (시연 데이터 구분)</text>
  <text x="312" y="459" font-size="11" fill="#64748B">• version, created_at</text>

  <!-- Relation APPLICATIONS -> ITEMS -->
  <line x1="544" y1="320" x2="590" y2="320" stroke="#0F5132" stroke-width="2" marker-end="url(#erdArr)"/>
  <text x="567" y="312" font-size="10.5" font-weight="700" fill="#0F5132" text-anchor="middle">1 : N</text>

  <!-- Table 3: APPLICATION_ITEMS -->
  <rect x="594" y="202" width="242" height="316" rx="10" fill="#FFFFFF" stroke="#0F5132" stroke-width="1.8"/>
  <rect x="594" y="202" width="242" height="32" rx="10" fill="#15803D"/>
  <text x="608" y="223" font-size="12.5" font-weight="800" fill="#FFFFFF">APPLICATION_ITEMS (가구 품목)</text>
  <text x="608" y="250" font-size="11" class="mono" fill="#0F172A">PK id / FK application_id</text>
  <text x="608" y="269" font-size="11" fill="#334155">• category (6대 가구 분류)</text>
  <text x="608" y="288" font-size="11" fill="#334155">• item_name (품목명)</text>
  <text x="608" y="307" font-size="11" fill="#334155">• condition_grade (최상~하)</text>
  <text x="608" y="326" font-size="11" fill="#334155">• handling_type (판매/처분)</text>
  <text x="608" y="345" font-size="11" font-weight="700" fill="#1E40AF">• status (4단계 + 취소·반려)</text>
  <text x="608" y="364" font-size="11" font-weight="700" fill="#B45309">• sale_deadline (판매마감일)</text>
  <text x="608" y="383" font-size="11" font-weight="700" fill="#065F46">• pickup_schedule (확정반출일)</text>
  <text x="608" y="402" font-size="11" fill="#334155">• public_notice (고객 노출용)</text>
  <text x="608" y="421" font-size="11" fill="#334155">• admin_item_memo (비공개)</text>
  <text x="608" y="440" font-size="11" fill="#64748B">• version, updated_at</text>

  <!-- Relations ITEMS -> PHOTOS & HISTORY -->
  <line x1="836" y1="270" x2="876" y2="270" stroke="#0F5132" stroke-width="2" marker-end="url(#erdArr)"/>
  <text x="856" y="262" font-size="10" font-weight="700" fill="#0F5132" text-anchor="middle">1:N</text>

  <line x1="836" y1="430" x2="876" y2="430" stroke="#0F5132" stroke-width="2" marker-end="url(#erdArr)"/>
  <text x="856" y="422" font-size="10" font-weight="700" fill="#0F5132" text-anchor="middle">1:N</text>

  <!-- Table 4: ITEM_PHOTOS -->
  <rect x="880" y="202" width="194" height="148" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
  <rect x="880" y="202" width="194" height="30" rx="10" fill="#1D4ED8"/>
  <text x="892" y="222" font-size="12" font-weight="800" fill="#FFFFFF">ITEM_PHOTOS (사진)</text>
  <text x="892" y="246" font-size="10.5" class="mono" fill="#0F172A">PK id / FK item_id</text>
  <text x="892" y="265" font-size="10.5" fill="#334155">• stored_name (UUID)</text>
  <text x="892" y="283" font-size="10.5" fill="#334155">• mime_type, byte_size</text>
  <text x="892" y="301" font-size="10.5" fill="#334155">• photo_tag (전체/흠집)</text>
  <text x="892" y="319" font-size="10.5" fill="#64748B">• sort_order, created_at</text>

  <!-- Table 5: STATUS_HISTORY -->
  <rect x="880" y="366" width="194" height="152" rx="10" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
  <rect x="880" y="366" width="194" height="30" rx="10" fill="#5B21B6"/>
  <text x="892" y="386" font-size="11.5" font-weight="800" fill="#FFFFFF">STATUS_HISTORY (이력)</text>
  <text x="892" y="410" font-size="10.5" class="mono" fill="#0F172A">PK id / FK item_id</text>
  <text x="892" y="428" font-size="10.5" fill="#334155">• actor_role, actor_name</text>
  <text x="892" y="446" font-size="10.5" fill="#334155">• action_type</text>
  <text x="892" y="464" font-size="10.5" fill="#334155">• before_value / after_value</text>
  <text x="892" y="482" font-size="10.5" fill="#64748B">• note, created_at</text>
</svg>
