<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="360" viewBox="0 0 1100 360" role="img" aria-label="가구팔고비움 전체 서비스 흐름도">
  <title>가구팔고비움 전체 서비스 흐름도</title>
  <defs>
    <linearGradient id="heroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F3D2E"/>
      <stop offset="100%" stop-color="#1B5E43"/>
    </linearGradient>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="#15803D"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Malgun Gothic", "맑은 고딕", sans-serif; }
  </style>

  <!-- Outer Canvas -->
  <rect x="0" y="0" width="1100" height="360" rx="18" fill="#F4F6F4" stroke="#D6E0DA" stroke-width="1.5"/>

  <!-- Top Strip -->
  <rect x="20" y="18" width="1060" height="48" rx="10" fill="url(#heroGrad)"/>
  <text x="40" y="48" font-size="18" font-weight="700" fill="#FFFFFF">End-to-End 서비스 작동 구조 — 고객 모바일 신청부터 판매 대행·반출 완료까지</text>
  <rect x="900" y="29" width="162" height="26" rx="13" fill="#DCFCE7"/>
  <text x="981" y="47" font-size="13" font-weight="700" fill="#0F5132" text-anchor="middle">1건 신청 : N개 품목</text>

  <!-- Step 1 Card -->
  <rect x="22" y="86" width="238" height="210" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="22" y="86" width="238" height="40" rx="14" fill="#ECFDF5"/>
  <rect x="22" y="112" width="238" height="14" fill="#ECFDF5"/>
  <circle cx="48" cy="106" r="13" fill="#0F5132"/>
  <text x="48" y="111" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">01</text>
  <text x="70" y="112" font-size="16" font-weight="700" fill="#0F3D2E">고객 간편 신청</text>
  <!-- Mini Camera/Phone Graphic -->
  <rect x="42" y="140" width="198" height="44" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
  <circle cx="66" cy="162" r="12" fill="#DCFCE7" stroke="#15803D" stroke-width="1.6"/>
  <rect x="60" y="157" width="12" height="9" rx="2" fill="none" stroke="#0F5132" stroke-width="1.5"/>
  <text x="86" y="159" font-size="13" font-weight="700" fill="#1E293B">모바일 사진 촬영·압축</text>
  <text x="86" y="176" font-size="11.5" fill="#64748B">다품목(소파·침대 등) 일괄 등록</text>
  <text x="38" y="208" font-size="13" fill="#334155">• 비회원 1분 신청 (+4자리 PIN)</text>
  <text x="38" y="229" font-size="13" fill="#334155">• 카카오 도로명 주소·층수 선택</text>
  <text x="38" y="250" font-size="13" fill="#334155">• 이사일 &amp; 희망 반출일 지정</text>
  <rect x="38" y="264" width="206" height="22" rx="6" fill="#FEF3C7"/>
  <text x="141" y="279" font-size="11.5" font-weight="700" fill="#92400E" text-anchor="middle">선택형 회원 로그인 자동입력 지원</text>

  <!-- Arrow 1 -->
  <line x1="264" y1="190" x2="288" y2="190" stroke="#15803D" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- Step 2 Card -->
  <rect x="294" y="86" width="238" height="210" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="294" y="86" width="238" height="40" rx="14" fill="#EFF6FF"/>
  <rect x="294" y="112" width="238" height="14" fill="#EFF6FF"/>
  <circle cx="320" cy="106" r="13" fill="#1D4ED8"/>
  <text x="320" y="111" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">02</text>
  <text x="342" y="112" font-size="16" font-weight="700" fill="#1E3A8A">보안 검증 · DB 저장</text>
  <rect x="314" y="140" width="198" height="44" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
  <circle cx="338" cy="162" r="12" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.6"/>
  <path d="M334,162 L337,165 L343,158" fill="none" stroke="#1E40AF" stroke-width="2"/>
  <text x="358" y="159" font-size="13" font-weight="700" fill="#1E293B">자택 사진 GPS 자동 제거</text>
  <text x="358" y="176" font-size="11.5" fill="#64748B">매직바이트 검증 &amp; 난수 파일명</text>
  <text x="310" y="208" font-size="13" fill="#334155">• 중복 제출 차단(Idempotency)</text>
  <text x="310" y="229" font-size="13" fill="#334155">• SQLite 단일 트랜잭션 저장</text>
  <text x="310" y="250" font-size="13" fill="#334155">• 접수번호(FR-날짜-순번) 발급</text>
  <rect x="310" y="264" width="206" height="22" rx="6" fill="#DBEAFE"/>
  <text x="413" y="279" font-size="11.5" font-weight="700" fill="#1E40AF" text-anchor="middle">실패 시 업로드 파일 즉시 롤백</text>

  <!-- Arrow 2 -->
  <line x1="536" y1="190" x2="560" y2="190" stroke="#15803D" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- Step 3 Card -->
  <rect x="566" y="86" width="238" height="210" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="566" y="86" width="238" height="40" rx="14" fill="#ECFDF5"/>
  <rect x="566" y="112" width="238" height="14" fill="#ECFDF5"/>
  <circle cx="592" cy="106" r="13" fill="#0F5132"/>
  <text x="592" y="111" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">03</text>
  <text x="614" y="112" font-size="16" font-weight="700" fill="#0F3D2E">운영자 상태·일정 관리</text>
  <rect x="586" y="140" width="198" height="44" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
  <circle cx="610" cy="162" r="12" fill="#DCFCE7" stroke="#15803D" stroke-width="1.6"/>
  <rect x="604" y="156" width="12" height="11" rx="2" fill="none" stroke="#0F5132" stroke-width="1.5"/>
  <text x="630" y="159" font-size="13" font-weight="700" fill="#1E293B">품목별 판매 / 처분 분기</text>
  <text x="630" y="176" font-size="11.5" fill="#64748B">이사일 전 판매 마감일 지정</text>
  <text x="582" y="208" font-size="13" fill="#334155">• 4단계 상태 &amp; 캘린더 보드</text>
  <text x="582" y="229" font-size="13" fill="#334155">• 원터치 전화·안내문자 템플릿</text>
  <text x="582" y="250" font-size="13" fill="#334155">• 모든 변경 이력 자동 감사로그</text>
  <rect x="582" y="264" width="206" height="22" rx="6" fill="#D1FAE5"/>
  <text x="685" y="279" font-size="11.5" font-weight="700" fill="#065F46" text-anchor="middle">이사일 D-Day 임박 건 우선 알림</text>

  <!-- Arrow 3 -->
  <line x1="808" y1="190" x2="832" y2="190" stroke="#15803D" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- Step 4 Card -->
  <rect x="838" y="86" width="240" height="210" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="838" y="86" width="240" height="40" rx="14" fill="#F5F3FF"/>
  <rect x="838" y="112" width="240" height="14" fill="#F5F3FF"/>
  <circle cx="864" cy="106" r="13" fill="#5B21B6"/>
  <text x="864" y="111" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">04</text>
  <text x="886" y="112" font-size="16" font-weight="700" fill="#3B0764">실시간 조회 · 방문 반출</text>
  <rect x="858" y="140" width="200" height="44" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
  <circle cx="882" cy="162" r="12" fill="#EDE9FE" stroke="#6D28D9" stroke-width="1.6"/>
  <path d="M877,162 L887,162 M883,158 L887,162 L883,166" fill="none" stroke="#5B21B6" stroke-width="1.7"/>
  <text x="902" y="159" font-size="13" font-weight="700" fill="#1E293B">고객 직접 진행현황 확인</text>
  <text x="902" y="176" font-size="11.5" fill="#64748B">PIN 조회 또는 마이페이지</text>
  <text x="854" y="208" font-size="13" fill="#334155">• 품목별 판매마감·반출일 열람</text>
  <text x="854" y="229" font-size="13" fill="#334155">• 약속된 일정에 안전 방문 반출</text>
  <text x="854" y="250" font-size="13" fill="#334155">• 처리완료 종결 및 CSV 정산자료</text>
  <rect x="854" y="264" width="208" height="22" rx="6" fill="#EDE9FE"/>
  <text x="958" y="279" font-size="11.5" font-weight="700" fill="#5B21B6" text-anchor="middle">반복 전화 문의(CS) 대폭 감소</text>

  <!-- Bottom Caption Bar -->
  <rect x="22" y="310" width="1056" height="34" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="40" y="332" font-size="12.5" fill="#475569">핵심 운영 공식:  [이사일] 기준으로 [판매 마감일]까지 선판매 대행을 진행하고, 미판매·처분 희망 가구는 확정된 [반출 일정]에 일괄 수거합니다.</text>
</svg>
